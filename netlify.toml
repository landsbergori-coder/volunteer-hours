[build]
  # המיגרציות מורצות בזמן הבנייה: סביבת Netlify מגיעה ל-Neon, ולכן זה המקום
  # היחיד שממנו אפשר להחיל שינויי סכמה. כשל במיגרציה מפיל את הבנייה ולא מפרסם.
  command = "npm run db:deploy && npm run build"
  publish = ".next"

[build.environment]
  # רשימת ה-engines שיורדים ב-postinstall. חייבת לכלול גם את debian (מכונת
  # הבנייה, לצורך המיגרציות) וגם את rhel (זמן ריצה בפונקציות), אחרת
  # prisma migrate deploy נכשל עם "Could not find schema-engine binary".
  # רק יעדים קונקרטיים — המשתנה הזה לא מקבל "native" ונופל עליו
  # ("Unknown binaryTarget native"), בניגוד ל-binaryTargets שבסכמה.
  PRISMA_CLI_BINARY_TARGETS = "debian-openssl-3.0.x,rhel-openssl-3.0.x"

[[plugins]]
  package = "@netlify/plugin-nextjs"
